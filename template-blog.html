<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5B56HBZC');</script>
  <!-- End Google Tag Manager -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{title}} | Paris Time Machine</title>
  <meta name="description" content="{{description}}">
  <meta name="keywords"    content="{{keywords}}">
  <meta name="author"      content="{{author}}">
  <link rel="canonical"    href="{{site_url}}/blog/{{slug}}.html">

  <meta property="og:type"        content="article">
  <meta property="og:url"         content="{{site_url}}/blog/{{slug}}.html">
  <meta property="og:title"       content="{{title}} | Paris Time Machine">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image"       content="{{site_url}}/{{image}}">

  <meta property="twitter:card"        content="summary_large_image">
  <meta property="twitter:url"         content="{{site_url}}/blog/{{slug}}.html">
  <meta property="twitter:title"       content="{{title}} | Paris Time Machine">
  <meta property="twitter:description" content="{{description}}">
  <meta property="twitter:image"       content="{{site_url}}/{{image}}">

  <meta property="article:published_time" content="{{date}}">
  <meta property="article:modified_time"  content="{{modified_date}}">
  <meta property="article:section"        content="{{category}}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{title}}",
    "image": "{{site_url}}/{{image}}",
    "datePublished": "{{date}}",
    "dateModified": "{{modified_date}}",
    "author": {
      "@type": "Person",
      "name": "{{author}}",
      "url": "{{site_url}}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "Paris Time Machine",
      "logo": {
        "@type": "ImageObject",
        "url": "{{site_url}}/assets/favicon/android-chrome-192x192.png"
      }
    },
    "description": "{{description}}"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
  <link rel="manifest" href="../assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#fdf0d5">

  <style>

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a   { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    b, strong { font-weight: 700; }

    /* ── Variables ── */
    :root {
      --blanc:      #fdf0d5;
      --blanc-f:    #fceac8;
      --blanc-cl:   #fff7e7;
      --bleu:       #003049;
      --bleu-clair: #669bbc;
      --rouge:      #c1121f;
      --orange:     #FF7519;
    }

    body {
      font-family: "Archivo", sans-serif;
      background: var(--blanc);
      color: var(--bleu);
      line-height: 1.6;
      -webkit-text-size-adjust: none;
    }


    /* ── Cover image ── */
    .article-cover {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    /* ── Article wrapper ── */
    .article-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Breadcrumb ── */
    .breadcrumb {
      font-size: 0.78rem;
      color: #aaa;
      margin-bottom: 1.2rem;
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .breadcrumb a { color: var(--bleu-clair); }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb-sep { color: #ccc; }

    /* ── Article header ── */
    .article-category {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--orange);
      margin-bottom: 0.6rem;
    }
    .article-title {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }
    .article-meta {
      font-size: 0.82rem;
      color: #aaa;
      margin-bottom: 2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1.5px solid var(--blanc-f);
    }

    /* ── Article body typography ── */
    .article-body { font-size: 1rem; line-height: 1.75; color: #1c1c1c; }

    .article-body h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--bleu);
      margin: 2rem 0 0.6rem;
      line-height: 1.3;
    }
    .article-body h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--bleu);
      margin: 1.5rem 0 0.4rem;
    }
    .article-body p  { margin-bottom: 1.1rem; }
    .article-body ul, .article-body ol {
      padding-left: 1.4rem;
      margin-bottom: 1.1rem;
    }
    .article-body li { margin-bottom: 0.4rem; }
    .article-body a  { color: var(--bleu-clair); text-decoration: underline; text-underline-offset: 2px; }
    .article-body a:hover { color: var(--bleu); }
    .article-body blockquote {
      border-left: 3px solid var(--orange);
      padding: 0.6rem 1rem;
      margin: 1.2rem 0;
      background: var(--blanc-cl);
      border-radius: 0 0.5rem 0.5rem 0;
      font-style: italic;
      color: #555;
    }
    .article-body hr {
      border: none;
      border-top: 1.5px solid var(--blanc-f);
      margin: 2rem 0;
    }

    /* ── Affiliate CTA row ── */
    .affiliate-box {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: var(--blanc-cl);
      border: 1.5px solid var(--blanc-f);
      border-radius: 0.75rem;
      padding: 0.7rem 0.85rem;
      margin: 0.5rem 0 1rem;
      color: inherit;
      transition: background 0.15s;
    }
    .affiliate-box:hover { background: var(--blanc-f); }
    /* stretched link — covers the whole box */
    .affiliate-box-overlay {
      position: absolute;
      inset: 0;
      border-radius: inherit;
    }
    .affiliate-box-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.06rem;
    }
    .affiliate-box-label {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .affiliate-box--official .affiliate-box-label { color: var(--bleu-clair); }
    .affiliate-box--gyg     .affiliate-box-label { color: var(--orange); }
    .affiliate-box-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--bleu);
      line-height: 1.3;
    }
    .affiliate-box-desc {
      font-size: 0.79rem;
      color: #888;
      line-height: 1.3;
      margin-top: 0.08rem;
    }
    .affiliate-box-chevron {
      flex-shrink: 0;
      color: var(--bleu-clair);
    }

    /* ── Tour CTA (full-width, after article) ── */
    .tour-cta {
      background: var(--bleu);
      color: white;
      text-align: center;
      padding: 2.5rem 1.5rem 2rem;
    }
    .tour-cta h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.5rem; }
    .tour-cta p  { font-size: 0.9rem; color: rgba(255,255,255,0.72); margin-bottom: 1.4rem; }
    .tour-cta-btn {
      display: inline-block;
      background: var(--orange);
      color: white;
      font-family: "Archivo", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.85rem 1.8rem;
      border-radius: 0.75rem;
      text-decoration: none;
      box-shadow: 0 3px 12px rgba(255,117,25,0.35);
    }
    .tour-cta-btn:hover { opacity: 0.9; color: white; }

    /* ── Article footer nav ── */
    .article-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1.5rem 1rem 2.5rem;
      text-align: center;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--bleu);
    }
    .back-link svg { transform: scaleX(-1); }
    .back-link:hover { color: var(--bleu-clair); }
    .back-link--secondary { color: #aaa; font-weight: 500; font-size: 0.88rem; }
    .back-link--secondary:hover { color: var(--bleu); }

  </style>

</head>
<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5B56HBZC"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <img class="article-cover" src="/{{image}}" alt="{{title}}">

  <div class="article-wrap">

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a>
      <span class="breadcrumb-sep">›</span>
      <a href="/blog/">Blog</a>
      <span class="breadcrumb-sep">›</span>
      <span>{{title}}</span>
    </nav>

    <p class="article-category">{{category}}</p>
    <h1 class="article-title">{{title}}</h1>
    <p class="article-meta">By {{author}} · {{date}}</p>

    <div class="article-body">
      {{content}}
    </div>

  </div>

  <section class="tour-cta">
    <h2>Want to discover Paris?</h2>
    <p>In our tours, we take you one street away from the crowds, in the hidden heart of the city ❤️</p>
    <a class="tour-cta-btn"
      href="https://www.guruwalk.com/walks/59922-paris-time-machine-a-local-s-perspective"
      target="_blank" rel="noopener">
      🎟️ Reserve your spot
    </a>
  </section>

  <div class="article-footer">
    <a class="back-link" href="/blog/" aria-label="Back to blog posts">
      <svg style="height:1rem;width:1rem;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48" d="M184 112l144 144-144 144"/>
      </svg>
      Back to blog posts
    </a>
    <a class="back-link back-link--secondary" href="/" aria-label="Back to website">
      <svg style="height:0.9rem;width:0.9rem;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48" d="M184 112l144 144-144 144"/>
      </svg>
      Back to website
    </a>
  </div>

</body>
</html>
